[project]
name = "sns-comment-backend"
version = "0.1.0"
description = "SNS 키워드 모니터링 + 사람 승인형 답변 웹앱 — 백엔드"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "tortoise-orm==0.22.2",
    "asyncpg==0.30.0",
    "aerich==0.8.1",
    "tomlkit==0.13.2",
    "pydantic-settings==2.7.1",
    "apscheduler==3.11.0",
    "httpx==0.28.1",
    "cryptography==49.0.0",
    "argon2-cffi==25.1.0",
]

[dependency-groups]
dev = [
    "ruff==0.9.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

# 앱 프로젝트 — 패키지 빌드/설치 없이 의존성만 관리한다
[tool.uv]
package = false

[tool.aerich]
tortoise_orm = "app.db.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."

[tool.ruff]
line-length = 100
extend-exclude = ["migrations"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["db: 실 Postgres 필요 — DATABASE_URL 설정 시에만 실행(CI pg 잡)"]
