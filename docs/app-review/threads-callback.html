<!DOCTYPE html>
<!-- nutti.co.kr/threads-callback.html 업로드용 — Threads OAuth redirect URI 대상 페이지.
     동의 완료 시 ?code=... 로 리다이렉트되면 코드를 표시하고, 운영자가 대시보드
     계정 연동 폼에 붙여넣는다(수동 운반 — 백엔드 공개 배포 없이 동작). -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Threads 계정 연동 — Nutti</title>
  <style>
    body { font-family: -apple-system, "Malgun Gothic", sans-serif; max-width: 640px;
           margin: 60px auto; padding: 0 20px; line-height: 1.7; color: #222; }
    h1 { font-size: 1.3rem; }
    code#code-box { display: block; padding: 14px; background: #f4f4f4; border-radius: 8px;
           word-break: break-all; font-size: .95rem; margin: 16px 0; }
    button { padding: 10px 18px; border: 0; border-radius: 8px; background: #F4803D;
           color: #fff; font-size: 1rem; cursor: pointer; }
    .error { color: #c0392b; }
    .ok { color: #1e824c; }
  </style>
</head>
<body>
  <h1>Threads 계정 연동</h1>
  <div id="content">잠시만요…</div>
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var el = document.getElementById('content');
      if (p.get('error')) {
        el.innerHTML = '<p class="error">연동이 취소되었거나 실패했습니다 (' +
          (p.get('error_description') || p.get('error')) +
          '). 대시보드에서 다시 시도해 주세요.</p>';
        return;
      }
      var code = p.get('code');
      if (!code) {
        el.innerHTML = '<p class="error">인증 코드가 없습니다. 대시보드의 "Threads로 연결" 버튼으로 다시 시작해 주세요.</p>';
        return;
      }
      // Meta 가 코드 뒤에 #_ 프래그먼트를 붙이는 경우 방어
      code = code.replace(/#_$/, '');
      el.innerHTML =
        '<p>승인이 완료되었습니다. 아래 <strong>연동 코드</strong>를 복사해 대시보드의 ' +
        'SNS 계정 연동 화면에 붙여넣어 주세요. <em>코드는 일회용이며 곧 만료됩니다.</em></p>' +
        '<code id="code-box"></code>' +
        '<button id="copy-btn">코드 복사</button> <span id="copied"></span>';
      document.getElementById('code-box').textContent = code;
      document.getElementById('copy-btn').addEventListener('click', function () {
        navigator.clipboard.writeText(code).then(function () {
          document.getElementById('copied').textContent = '복사됨!';
          document.getElementById('copied').className = 'ok';
        });
      });
    })();
  </script>
</body>
</html>
