name: CI

# 단일 워크플로 + 영역 path 필터 + 단일 게이트(ci-ok).
# - 백엔드 잡(test·pg)은 frontend/** 만 바뀐 PR 에선 skip, 프론트 잡은 frontend/** 바뀔 때만 run.
#   → 백엔드 PR 은 프론트 빌드를, 프론트 PR 은 백엔드 테스트를 서로 안 기다린다.
# - 브랜치 보호의 required check 는 **ci-ok 하나만** 건다(path 필터 skip 이 머지를 영구 pending 시키지 않게).
# 브랜치 전략: dev=통합 트렁크(작업 PR 타깃), prod=배포(dev→prod 승격 PR), main=동결.
on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# paths-filter 가 PR 변경 파일을 GitHub API 로 조회한다 — pull-requests: read 필수
# (없으면 "Resource not accessible by integration" 으로 changes 잡이 실패).
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: 변경 영역 감지
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # 기본값 'some'(= 패턴 OR)이면 `'**'` 가 항상 매치해 `'!frontend/**'` 가 死문이
          # 된다 — 실제로 프론트 전용 PR(#110)에서 백엔드 잡 3개가 전부 돌았다(이슈 #111).
          # 'some-with-excludes' = "긍정 패턴 하나 이상 매치 + 부정 패턴 하나도 매치 안 함".
          # 주의: 부정 패턴만 남기면(`- '!frontend/**'` 단독) 공식 문서상 **아무것도 매치하지
          # 않아** 백엔드 잡이 영구 skip 되고, ci-ok 는 skip=통과라 헛green 이 된다.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            backend:
              - '**'
              - '!frontend/**'
            frontend:
              - 'frontend/**'
      - name: 감지 결과(스킵 판정 근거를 로그에 남긴다)
        run: echo "backend=${{ steps.filter.outputs.backend }} frontend=${{ steps.filter.outputs.frontend }}"

  test:
    name: Lint & Test (py${{ matrix.python-version }})
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies (uv, 락파일 고정)
        run: uv sync --locked
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Test (pytest, DB 불필요)
        run: uv run pytest -m "not db"

  pg-migration:
    name: PostgreSQL 마이그레이션 적용
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sns
          POSTGRES_PASSWORD: sns
          POSTGRES_DB: sns
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sns -d sns"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: "postgres://sns:sns@localhost:5432/sns"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies (uv, 락파일 고정)
        run: uv sync --locked
      - name: aerich 마이그레이션 적용(실 PG)
        run: uv run aerich upgrade
      - name: DB 통합 테스트 (pytest -m db, 마이그레이션 적용된 스키마 대상)
        run: uv run pytest -m db

  frontend-build:
    name: 프론트엔드 빌드 & 테스트
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install + build (tsc --noEmit + vite build)
        run: |
          npm ci
          npm run build
      # vitest 는 package-lock 에 고정돼 위 npm ci 로 함께 설치된다(추가 러너 불필요).
      # `npm test` = `vitest run` — watch 모드가 아니라 1회 실행 후 종료한다.
      - name: Test (vitest)
        run: npm test

  ci-ok:
    name: CI Gate
    # 브랜치 보호에서 required 로 거는 **유일한** 체크.
    # changes 잡도 집계에 포함 — changes 실패 시 모든 테스트 잡이 skip 되는데
    # skip=통과 규칙만 있으면 게이트가 헛green 이 된다(실제 발생했던 구멍).
    needs: [changes, test, pg-migration, frontend-build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: 관련 잡 결과 집계(skip=통과, failure/cancelled=차단)
        run: |
          for r in "${{ needs.changes.result }}" "${{ needs.test.result }}" "${{ needs.pg-migration.result }}" "${{ needs.frontend-build.result }}"; do
            echo "result: $r"
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::필수 잡이 실패/취소됨($r)"
              exit 1
            fi
          done
          echo "모든 관련 잡 통과(또는 해당 없음)."
